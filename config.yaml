# =============================================================================
# Configurazione del progetto - pianificatore robusto su trasporto pubblico
# =============================================================================
#
# Il collector si RIFIUTA di partire se un indirizzo obbligatorio inizia ancora
# con "INSERIRE_QUI_": e' una scelta deliberata, perche' l'errore piu' costoso in
# questo progetto e' accorgersi dopo tre giorni di non aver raccolto nulla.
#
# Per verificare che un feed contenga davvero i ritardi PRIMA di adottarlo:
#     python scripts/verifica_feed.py
#     python -m src.collector.poll_realtime --diagnostica <url>
#
# =============================================================================

raccolta:
  # 60 s e' il compromesso fra risoluzione temporale e volume su disco. La maggior
  # parte delle agenzie rigenera il feed ogni 30-120 s: interrogare piu' spesso
  # produrrebbe soprattutto duplicati, che vengono comunque scartati dalla
  # deduplica basata su header.timestamp.
  intervallo_polling_secondi: 60

  # Deve restare ampiamente sotto l'intervallo di polling: un feed lento non deve
  # mai far slittare il tick successivo.
  timeout_richiesta_secondi: 20

  # L'archivio GTFS statico puo' pesare decine di MB, quindi ha un timeout suo.
  timeout_gtfs_statico_secondi: 300

  # Ritentare troppo a lungo e' inutile: se il feed non risponde entro pochi
  # secondi, il tick successivo arriva comunque fra un minuto.
  tentativi_max: 3
  backoff_base_secondi: 2.0
  backoff_max_secondi: 20.0

  # Controlla l'orario statico una volta al giorno. Quando l'agenzia pubblica
  # anche il file .md5, il confronto costa una cinquantina di byte invece
  # dell'intero archivio.
  snapshot_gtfs_statico: true

  # Oltre questa durata senza una raccolta riuscita, la finestra viene registrata
  # come interruzione in gaps.jsonl. Cinque minuti sono cinque tick mancati: un
  # valore piu' basso segnalerebbe come interruzione un singolo errore isolato.
  soglia_interruzione_secondi: 300

  cartella_rt: data/raw/rt
  cartella_gtfs: data/raw/gtfs
  cartella_log: logs

  # Alcuni server rifiutano lo user agent predefinito di urllib. Dichiararsi in
  # modo onesto e riconoscibile e' anche una cortesia verso chi gestisce il feed.
  user_agent: "progetto-icon-tpl/0.1 (raccolta dati per progetto universitario)"

citta:
  # ---------------------------------------------------------------------------
  # ROMA - Roma Mobilita'
  # L'orario statico cambia quasi ogni giorno e i trip_id non sono stabili nel
  # tempo: senza la versione statica valida nel giorno di ogni osservazione, in
  # backtesting non si potrebbero ricostruire gli orari programmati. Per questo
  # e' configurato anche l'indirizzo del .md5, che permette di accorgersi del
  # cambiamento scaricando una cinquantina di byte invece dell'intero archivio.
  # ---------------------------------------------------------------------------
  - nome: roma
    attiva: true
    fuso_orario: Europe/Rome
    url_gtfs_statico: https://romamobilita.it/sites/default/files/rome_static_gtfs.zip
    url_gtfs_statico_md5: https://romamobilita.it/sites/default/files/rome_static_gtfs.zip.md5
    feed_rt:
      trip_updates: https://romamobilita.it/sites/default/files/rome_rtgtfs_trip_updates_feed.pb
      vehicle_positions: https://romamobilita.it/sites/default/files/rome_rtgtfs_vehicle_positions_feed.pb
    intestazioni_http: {}

  # ---------------------------------------------------------------------------
  # TORINO - GTT
  # Gli indirizzi sono in HTTPS e non in HTTP: verificato il 2026-08-25 che
  # l'host percorsieorari.gtt.to.it NON accetta connessioni sulla porta 80 (la
  # connessione TCP scade dopo ~15 s) mentre sulla 443 risponde in 0,1 s. Con
  # http:// entrambi i feed erano irraggiungibili; con https:// restituiscono
  # 383 trip_update e 2.210 stop_time_update.
  #
  # MANCA ANCORA l'orario statico. Finche' non c'e', i dump real-time di Torino
  # vengono raccolti ma NON saranno interpretabili in Fase 3, perche' non si
  # potra' risalire agli orari programmati. Cercarlo sul portale open data del
  # Comune di Torino / GTT (voce "GTFS" o "orario programmato") e incollarlo qui.
  # ---------------------------------------------------------------------------
  - nome: torino
    attiva: true
    fuso_orario: Europe/Rome
    url_gtfs_statico: INSERIRE_QUI_URL_GTFS_STATICO_TORINO
    url_gtfs_statico_md5: null
    feed_rt:
      trip_updates: https://percorsieorari.gtt.to.it/das_gtfsrt/trip_update.aspx
      vehicle_positions: https://percorsieorari.gtt.to.it/das_gtfsrt/vehicle_position.aspx
    intestazioni_http: {}
